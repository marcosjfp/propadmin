name: propadmin-local
services:
  database:
    image: postgres:16
    environment:
      POSTGRES_USER: propadmin
      POSTGRES_PASSWORD: ${LOCAL_DB_PASSWORD:?Set LOCAL_DB_PASSWORD in .env.test.local}
      POSTGRES_DB: propadmin_local
    ports:
      - '127.0.0.1:55432:5432'
    volumes:
      - local-database:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U propadmin -d propadmin_local']
      interval: 2s
      timeout: 3s
      retries: 15
volumes:
  local-database:
